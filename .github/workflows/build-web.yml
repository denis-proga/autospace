name: Build web

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'core/**'
      - 'gradle/**'
      - '*.kts'
      - '.github/workflows/build-web.yml'
  workflow_dispatch:
    inputs:
      binaryen_version:
        description: 'Версия Binaryen для wasm-opt (например 124, 126, 127)'
        required: false
        default: '124'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      # wasm-opt из Binaryen 125 (версия по умолчанию в Kotlin 2.4.10) падает на CI с кодом 139.
      # Версия задаётся параметром: при ручном запуске (Run workflow) её можно поменять без правки кода.
      - name: Build web distribution
        run: |
          chmod +x gradlew
          ./gradlew :app:webApp:wasmJsBrowserDistribution --no-daemon -PbinaryenVersion=${{ inputs.binaryen_version || '124' }}

      - name: Publish to web-dist branch
        run: |
          cd app/webApp/build/dist/wasmJs/productionExecutable
          git init -b web-dist
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -m "Web build ${GITHUB_SHA}"
          git push --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" web-dist