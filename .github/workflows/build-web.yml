name: Build web

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'core/**'
      - 'gradle/**'
      - '*.kts'
      - '.github/workflows/build-web.yml'
  workflow_dispatch:
    inputs:
      binaryen_version:
        description: 'Версия Binaryen для wasm-opt (например 124, 125, 126)'
        required: false
        default: '125'
      wasm_opt_mode:
        description: 'Оптимизация wasm-opt: full (по умолчанию в Kotlin), light (только -O2), none (без оптимизаций)'
        type: choice
        options: [light, full, none]
        default: light

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      # wasm-opt (Binaryen) падает на CI с кодом 139 на полном наборе оптимизаций (проверено на 124 и 125).
      # Версию и режим оптимизации можно менять при ручном запуске (Run workflow) без правки кода.
      - name: Build web distribution
        run: |
          chmod +x gradlew
          ./gradlew :app:webApp:wasmJsBrowserDistribution --no-daemon -PbinaryenVersion=${{ inputs.binaryen_version || '125' }} -PwasmOptMode=${{ inputs.wasm_opt_mode || 'light' }}

      - name: Publish to web-dist branch
        run: |
          cd app/webApp/build/dist/wasmJs/productionExecutable
          git init -b web-dist
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -m "Web build ${GITHUB_SHA}"
          git push --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" web-dist