name: Build web

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'core/**'
      - 'gradle/**'
      - '*.kts'
      - '.github/workflows/build-web.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      # wasm-opt (Binaryen) падал с кодом 139 (segmentation fault) на большом бинарнике.
      # Даём ему больше памяти (swap) и снимаем ограничение стека.
      - name: Add swap space
        run: |
          sudo swapoff -a || true
          sudo fallocate -l 10G /mnt/swapfile
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
          free -h

      - name: Build web distribution
        run: |
          chmod +x gradlew
          ulimit -s unlimited || ulimit -s 1048576 || true
          echo "stack limit: $(ulimit -s)"
          ./gradlew :app:webApp:wasmJsBrowserDistribution --no-daemon

      - name: Publish to web-dist branch
        run: |
          cd app/webApp/build/dist/wasmJs/productionExecutable
          git init -b web-dist
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -m "Web build ${GITHUB_SHA}"
          git push --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" web-dist
